{% extends 'base.html' %}
{% block title %}PIN - {{ app_name }}{% endblock %}
{% block body %}
<div class="fh-center-screen">
  <div class="fh-card fh-setup-card text-center" style="max-width:360px;">
    <div class="fh-kid-photo mx-auto mb-3" style="width:100px;height:100px;">
      {% if child['photo_path'] %}
        <img src="/static/{{ child['photo_path'] }}" alt="{{ child['name'] }}">
      {% else %}
        <span class="fh-kid-initial" style="font-size:2.5rem;">{{ child['name'][0]|upper }}</span>
      {% endif %}
    </div>
    <h2 class="fh-title mb-1">{{ child['name'] }}</h2>
    <p class="text-muted mb-4">Enter your PIN</p>
    <form method="POST" id="pinForm" class="fh-pin-form"
          data-pin-min="1" data-pin-max="64"
          data-pin-min-dots="4" data-pin-max-dots="12">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="fh-pin-display mb-3" id="pinDisplay" aria-live="polite"></div>
      <div class="fh-pin-input-wrap">
        <input type="password" name="pin" id="pinInput"
               class="form-control fh-input fh-pin-input"
               inputmode="numeric" pattern="[0-9]*" maxlength="64"
               autocomplete="off" aria-label="PIN">
      </div>
      <div class="fh-pin-pad" role="group" aria-label="PIN keypad">
        <button type="button" class="fh-pin-key" data-key="1">1</button>
        <button type="button" class="fh-pin-key" data-key="2">2</button>
        <button type="button" class="fh-pin-key" data-key="3">3</button>
        <button type="button" class="fh-pin-key" data-key="4">4</button>
        <button type="button" class="fh-pin-key" data-key="5">5</button>
        <button type="button" class="fh-pin-key" data-key="6">6</button>
        <button type="button" class="fh-pin-key" data-key="7">7</button>
        <button type="button" class="fh-pin-key" data-key="8">8</button>
        <button type="button" class="fh-pin-key" data-key="9">9</button>
        <button type="button" class="fh-pin-key fh-pin-back" data-key="backspace" aria-label="Backspace">
          <i class="bi bi-backspace"></i>
        </button>
        <button type="button" class="fh-pin-key" data-key="0">0</button>
        <button type="button" class="fh-pin-key fh-pin-go pin-btn-enter" data-key="go" aria-label="Submit PIN">
          <i class="bi bi-check-lg"></i><span class="fh-pin-key-label">Enter</span>
        </button>
      </div>
      <button type="button" class="fh-pin-clear-link" data-key="clear">Clear</button>
    </form>
    <div class="mt-3">
      <a href="{{ url_for('kiosk_login') }}" class="fh-link fh-link-sm">
        <i class="bi bi-arrow-left me-1"></i>Back
      </a>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/pin-pad.js"></script>
{% endblock %}
