{% extends 'base.html' %}
{% block title %}Setup - {{ app_name }}{% endblock %}
{% block body %}
<div class="fh-center-screen">
  <div class="fh-card fh-setup-card">
    <div class="text-center mb-4">
      <div class="fh-logo-icon mb-3">
        <i class="bi bi-stars"></i>
      </div>
      <h1 class="fh-title">Chore Gremlin</h1>
      <p class="text-muted fh-tagline">The little gremlin that gets the chores done</p>
      <p class="text-muted">First-time setup &mdash; create your admin account</p>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fh-label">Hub Name</label>
        <input type="text" name="app_name" class="form-control fh-input" value="Chore Gremlin" required>
        <div class="form-text">This name appears on the kiosk and dashboard.</div>
      </div>
      <div class="mb-3">
        <label class="form-label fh-label">Admin Name</label>
        <input type="text" name="name" class="form-control fh-input" placeholder="Your name" required>
      </div>
      <div class="mb-3">
        <label class="form-label fh-label">Username</label>
        <input type="text" name="username" class="form-control fh-input" placeholder="your-username" required>
      </div>
      <div class="mb-3">
        <label class="form-label fh-label">Password</label>
        <input type="password" name="password" class="form-control fh-input" placeholder="At least 10 characters" required minlength="10">
      </div>
      <div class="mb-4">
        <label class="form-label fh-label">Confirm Password</label>
        <input type="password" name="confirm" class="form-control fh-input" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn fh-btn-cyan w-100 fh-btn-lg">
        <i class="bi bi-check-circle-fill me-2"></i>Create Admin Account
      </button>
    </form>
  </div>
</div>
{% endblock %}
