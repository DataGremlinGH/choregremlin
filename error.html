{% extends 'base.html' %}
{% block title %}Error {{ code }} - {{ app_name }}{% endblock %}
{% block body %}
<div class="fh-center-screen">
  <div class="fh-card text-center" style="max-width:400px;">
    <div class="fh-logo-icon mx-auto mb-3" style="font-size:2rem;">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h1 class="fh-title">Error {{ code }}</h1>
    <p class="text-muted mb-4">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn fh-btn-cyan"><i class="bi bi-house"></i> Home</a>
  </div>
</div>
{% endblock %}
